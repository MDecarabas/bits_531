# BL531 motors and motor-adjacent devices
#
# Migrated from queue-server/startup_bl531/01_motors.py.  Each top-level key is
# the dotted import path of a device class; every list item is a flat mapping of
# constructor keywords (guarneri calls Klass(**item)).  A bare EpicsSignal takes
# `read_pv:` (not `prefix:`); pseudopositioners / hexapod axes bake full PVs into
# their Components, so they take an explicit empty `prefix: ""`.  Devices with the
# "baseline" label are picked up by setup_baseline_stream().

ophyd.EpicsSignal:
  - {name: diode, read_pv: "bl201-beamstop:current", labels: ["detectors", "baseline"]}

