# BL531 base device configuration (guarneri loader).
#

# This file holds only the simulated devices used by the BITS sim plans
# (sim_count_plan / sim_print_plan / sim_rel_scan_plan) so they run with no IOC.
apsbits.utils.sim_creator.predefined_device:
  - {creator: ophyd.sim.motor, name: sim_motor}
  - {creator: ophyd.sim.noisy_det, name: sim_det}
